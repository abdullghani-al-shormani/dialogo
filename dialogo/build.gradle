plugins {
    alias(libs.plugins.android.library)
    id 'maven-publish'
}

android {
    namespace 'com.abdullghani.dialogo'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        minSdk 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.ssp.android
    implementation libs.sdp.android

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}

// ==================== Maven Publish (JitPack) ====================

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.github.abdullghani-al-shormani'
                artifactId = 'dialogo'
                version = '1.0.0'

                pom {
                    name = 'Dialogo'
                    description = 'An elegant, customizable Android dialog library.'
                    url = 'https://github.com/abdullghani-al-shormani/dialogo'

                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }

                    developers {
                        developer {
                            id = 'abdullghani-al-shormani'
                            name = 'Abdullghani Al-Shormani'
                        }
                    }

                    scm {
                        url = 'https://github.com/abdullghani-al-shormani/dialogo'
                        connection = 'scm:git:git://github.com/abdullghani-al-shormani/dialogo.git'
                        developerConnection = 'scm:git:ssh://github.com/abdullghani-al-shormani/dialogo.git'
                    }
                }
            }
        }
    }
}